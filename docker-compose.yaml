services:
  db:
    image: postgres:17.5-bookworm
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - seas-db-data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/pgdata
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
    networks:
      - seas

  adminer:
    image: adminer:5.3.0
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ADMINER_DESIGN=rmsoft
    networks:
      - seas
  api:
    build:
      context: api
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - API_PREFIX=${API_PREFIX}
      - API_PORT=8444
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - FIRST_USER_USERNAME=${FIRST_USER_USERNAME?Variable not set}
      - FIRST_USER_PASSWORD=${FIRST_USER_PASSWORD?Variable not set}
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8444/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    networks:
      - seas

volumes:
  seas-db-data:

networks:
  seas:
