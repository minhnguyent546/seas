services:
  db:
    restart: "no"
    ports:
      - "5433:5432"

  qdrant:
    restart: "no"
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
  adminer:
    restart: "no"
    ports:
      - "8555:8080"

  maildev:
    image: maildev/maildev:2.2.1
    restart: "no"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --tries=1 --spider http://localhost:1080/healthz || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - seas
    ports:
      - "1025:1025" # SMTP server
      - "1080:1080" # Web interface
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - MAILDEV_SMTP_PORT=1025 # Changed to match port mapping
      - MAILDEV_WEB_PORT=1080

  api:
    build:
      context: ./
      dockerfile: ./api/Dockerfile
    restart: "no"
    ports:
      - "8444:8444"
    environment:
      - SMTP_TLS=false
      - SMTP_SSL=false
      - SMTP_HOST=maildev
      - SMTP_PORT=1025
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8444"
      - --reload
    depends_on:
      maildev:
        condition: service_healthy
    develop:
      watch:
        - path: ./api
          action: sync
          target: /api
          ignore:
            - .venv
            - ./api/.venv
        - path: ./api_shared
          action: sync
          target: /api/api_shared
        - path: ./api/pyproject.toml
          action: rebuild

  mcp-server:
    build:
      context: ./
      dockerfile: ./mcp_server/Dockerfile
    restart: "no"
    ports:
      - "6274:6274"  # MCP inspector client UI
      - "6277:6277"  # MCP proxy server
    command: ["mcp", "run", "app/main.py:mcp", "--transport", "streamable-http"]
    develop:
      watch:
        - path: ./mcp_server
          action: sync
          target: /mcp_server
          ignore:
            - .venv
            - ./mcp_server/.venv
        - path: ./api_shared
          action: sync
          target: /mcp_server/api_shared
        - path: ./mcp_server/pyproject.toml
          action: rebuild
