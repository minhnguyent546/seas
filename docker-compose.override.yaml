services:
  db:
    restart: "no"
    ports:
      - "5433:5432"

  adminer:
    restart: "no"
    ports:
      - "8555:8080"
  api:
    build:
      context: api
      dockerfile: Dockerfile
    restart: "no"
    ports:
      - "8444:8444"
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8444"
      - --reload
    develop:
      watch:
        - path: ./api
          action: sync
          target: /app
          ignore:
            - .venv
            - ./api/.venv
        - path: ./api/pyproject.toml
          action: rebuild