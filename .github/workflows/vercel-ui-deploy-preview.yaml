name: Deploy UI to Vercel - Preview environment

on:
  push:
    branches:
      - dev
    paths:
      - "ui/**"
  pull_request:
    branches:
      - dev
    paths:
      - "ui/**"
  workflow_dispatch:

jobs:
  deploy-ui-to-vercel-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ui
    steps:
      - name: Clone the repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: "./ui/yarn.lock"
      - name: Install dependencies
        run: yarn install
      - name: Build project
        env:
          VITE_API_URL: "${{ secrets.VITE_API_URL }}"
        run: yarn build
      - name: Deploy Project Artifacts to Vercel
        run: yarn dlx vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }}
