name: Check python imports

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "api/**"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "api/**"
  workflow_dispatch:

jobs:
  check_python_imports:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
      - name: Clone the repository
        uses: actions/checkout@v4

      - name: Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v6
        with:
          version: ">=0.7.0"
          python-version: "3.12"
          enable-cache: true

      - name: Generate random password
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "FIRST_USER_PASSWORD=$(openssl rand -base64 16)" >> $GITHUB_ENV

      - name: Check python imports
        env:
          PYTHONPATH: "${{ github.workspace }}/api"
          GOOGLE_OAUTH2_CLIENT_ID: test-client-id
          GOOGLE_OAUTH2_CLIENT_SECRET: test-client-secret
          GITHUB_OAUTH2_CLIENT_ID: test-client-id
          GITHUB_OAUTH2_CLIENT_SECRET: test-client-secret
          GOOGLE_API_KEY: "${{ secrets.GOOGLE_API_KEY }}"
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
          ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
        run: |
          uv run python ../.github/workflows/check_python_imports.py --src_path app tests